comment:
  layout: "header, diff, flags, components"

# Coverage measurements vary slightly between runs even when no source
# changed, so allow a small project-level decrease.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.1%

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 0.1%

  individual_components:
    # IR framework and Wasm backend
    - component_id: trunk-ir
      name: "TrunkIR"
      paths:
        - "crates/trunk-ir/**"
        - "crates/trunk-ir-cranelift-backend/**"
        - "crates/trunk-ir-wasm-backend/**"

    # Front-end (parsing, CST lowering, AST-to-IR)
    - component_id: frontend
      name: "Frontend"
      paths:
        - "crates/tribute-front/**"

    # Middle-end
    - component_id: middle-end
      name: "Middle End"
      paths:
        - "crates/tribute-ir/**"
        - "crates/tribute-passes/**"

    # CLI, LSP, pipeline orchestration, shared utilities
    - component_id: driver
      name: "Driver"
      paths:
        - "src/**"
        - "crates/tribute-core/**"
