[package]
name = "trunk-ir"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TrunkIR: A multi-level dialect IR system"

[features]
default = []
salsa = ["dep:salsa"]
# Exposes `symbol::live_dynamic_symbols` for tests that check names are released.
symbol-stats = ["dep:malloc_size_of", "string_cache/malloc_size_of"]

[dependencies]
cranelift-entity.workspace = true
derive_more.workspace = true
hashbrown.workspace = true
inventory.workspace = true
itertools.workspace = true
lasso.workspace = true
malloc_size_of = { workspace = true, optional = true }
parking_lot.workspace = true
salsa = { workspace = true, optional = true }
rustc-hash.workspace = true
serde.workspace = true
smallvec.workspace = true
string_cache.workspace = true
tracing.workspace = true
trunk-ir-macros.workspace = true
winnow.workspace = true

[build-dependencies]
litrs = { version = "1", default-features = false }
string_cache_codegen.workspace = true

[dev-dependencies]
litrs = { version = "1", default-features = false }
insta.workspace = true
proptest.workspace = true
salsa.workspace = true
trybuild.workspace = true
