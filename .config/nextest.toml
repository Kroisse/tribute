[profile.default]
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(tribute) & test(/_slow$/)"
slow-timeout = { period = "60s", terminate-after = 1 }

# Instrumented compiler integration tests need more time than normal runs.
# Limit concurrent tests so coverage collection does not saturate the runner.
[profile.coverage]
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 1 }

# The default profile's `_slow` override also applies here, with lower
# precedence, and would cap these tests at the same 60s as every other test.
[[profile.coverage.overrides]]
filter = "package(tribute) & test(/_slow$/)"
slow-timeout = { period = "180s", terminate-after = 1 }
