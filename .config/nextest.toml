[profile.default]
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(tribute) & test(/_slow$/)"
slow-timeout = { period = "60s", terminate-after = 1 }

# Instrumented compiler integration tests need more time than normal runs.
# Limit concurrent tests so coverage collection does not saturate the runner.
[profile.coverage]
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 1 }
# The cross-process determinism check runs the instrumented CLI hundreds of
# times in sequence. The in-process check and the e2e tests cover the same
# compiler paths, and the regular test job still runs it.
default-filter = "not test(/_across_processes_slow$/)"
