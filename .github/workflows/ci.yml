name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # setup-rust-toolchain sets CARGO_PROFILE_DEV_DEBUG=0 unless it is already
  # set. Match Cargo.toml's dev profile, which the test profile shares, so
  # `cargo run` and `cargo test` in one job do not rebuild every dependency.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  clippy:
    name: Clippy
    runs-on: [self-hosted, macOS]
    # The self-hosted runner cleans target/ on checkout and has no Actions
    # cache; kache keeps compiled crates across runs instead.
    env:
      RUSTC_WRAPPER: kache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache: false

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Test lint failure propagation
        run: .ci/test-lint.sh

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false

      - name: Check formatting
        uses: actions-rust-lang/rustfmt@v1

  test:
    name: Test
    runs-on: [self-hosted, macOS]
    # The self-hosted runner cleans target/ on checkout and has no Actions
    # cache; kache keeps compiled crates across runs instead.
    env:
      RUSTC_WRAPPER: kache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # trybuild snapshots include standard-library source excerpts.
          components: rust-src
          cache: false

      - name: Install cargo-nextest and wasmtime
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,wasmtime

      - name: Build runtime sysroot
        run: cargo xtask runtime

      # Build with the test profile and dev-dependency features, so the test
      # run reuses these artifacts instead of rebuilding dependencies.
      - name: Build tests
        run: cargo nextest run --workspace --no-run

      - name: Run tests
        run: cargo nextest run --workspace -j 8

  canonical-native:
    name: Canonical native example (${{ matrix.platform }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner_json: '["self-hosted", "macOS"]'
            cache: false
            rustc_wrapper: kache
          - platform: Ubuntu
            runner_json: '"ubuntu-latest"'
            cache: true
            # An empty wrapper tells Cargo to run rustc directly.
            rustc_wrapper: ''
    runs-on: ${{ fromJSON(matrix.runner_json) }}
    env:
      RUSTC_WRAPPER: ${{ matrix.rustc_wrapper }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: ${{ matrix.cache }}
          # Only main saves caches; PRs restore them without evicting main's.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build runtime sysroot
        run: cargo xtask runtime

      - name: Compile canonical native example
        run: |
          cargo run --locked -- compile lang-examples/native_effects.trb \
            -o target/native-effects-example

      - name: Execute canonical native example
        run: |
          ./target/native-effects-example \
            > target/native-effects-example.stdout

      - name: Check canonical native output
        run: |
          diff -u \
            tests/expected/native_effects.stdout \
            target/native-effects-example.stdout

      - name: Run canonical calculator input contracts
        run: |
          cargo test --locked --test canonical_calculator \
            canonical_calculator_cli_matches_all_input_contracts -- --exact

      - name: Run canonical calculator AddressSanitizer contract
        if: matrix.platform == 'Ubuntu'
        run: |
          cargo test --locked --test canonical_calculator \
            canonical_calculator_asan_matches_scripted_contract -- --exact

  canonical-wasm:
    name: Canonical WasmGC example
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          # Only main saves caches; PRs restore them without evicting main's.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasmtime
        uses: taiki-e/install-action@v2
        with:
          tool: wasmtime

      - name: Compile canonical WasmGC example
        run: |
          cargo run --locked -- compile --target wasm \
            lang-examples/wasm_dynamic_output.trb \
            -o target/wasm-dynamic-output.wasm

      - name: Execute canonical WasmGC example
        run: |
          wasmtime -Wgc=y,function-references=y \
            target/wasm-dynamic-output.wasm \
            > target/wasm-dynamic-output.stdout

      - name: Check canonical WasmGC output
        run: |
          diff -u \
            tests/expected/wasm_dynamic_output.stdout \
            target/wasm-dynamic-output.stdout

  canonical-diagnostic:
    name: Canonical invalid example
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          # Only main saves caches; PRs restore them without evicting main's.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Require canonical invalid CLI failure
        shell: bash
        run: |
          mkdir -p target

          set +e
          cargo run --locked -- compile --target none \
            lang-examples/invalid_unresolved_name.trb \
            > target/invalid-unresolved-name.stdout \
            2> target/invalid-unresolved-name.stderr
          cli_status=$?
          set -e

          if [[ "$cli_status" -ne 1 ]]; then
            echo "expected exit status 1, got $cli_status" >&2
            exit 1
          fi

      - name: Check canonical semantic diagnostic
        run: cargo nextest run --locked -p tribute --test canonical_smoke

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview, rust-src
          cache: true
          # Only main saves caches; PRs restore them without evicting main's.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov, cargo-nextest, and wasmtime
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest,wasmtime

      - name: Build runtime sysroot
        run: cargo xtask runtime

      - name: Generate coverage report
        env:
          NEXTEST_PROFILE: coverage
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true
          fail_ci_if_error: false

  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          globs: '**/*.md'
