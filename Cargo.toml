[workspace]
members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Eunchong Yu <kroisse@gmail.com>"]
license = "MIT"

[workspace.dependencies]
ariadne = "0.6"
clap = { version = "4.6.7", features = ["derive"] }
cranelift-codegen = "0.135.2"
cranelift-entity = "0.135.2"
cranelift-frontend = "0.135.2"
cranelift-module = "0.135.2"
cranelift-object = "0.135.2"
crossbeam-channel = "0.5.16"
derive_more = { version = "2.0", features = ["display", "error", "from"] }
fluent-uri = "0.1.4"
im = "15"
insta = { version = "1.48", features = ["yaml"] }
itertools = "0.14"
itoa = "1"
inventory = "0.3"
lasso = "0.7"
libc = "0.2"
lsp-server = "0.10"
lsp-types = "0.97"
object = { version = "0.38", features = ["write_core"] }
parking_lot = "0.12"
proptest = "1.11"
heck = "0.5"
proc-macro2 = "1.0"
quote = "1.0"
ropey = "1.6"
rustc-hash = "2.1"
salsa = "0.28.4"
salsa-test-macros = { path = "crates/salsa-test-macros" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1.16", features = ["union", "const_generics", "serde"] }
strsim = "0.11"
target-lexicon = "0.13"
tempfile = "3.27"
trybuild = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26.13"
tree-sitter-tribute = { git = "https://github.com/Kroisse/tree-sitter-tribute", tag = "v0.8.0" }
tribute-core = { path = "crates/tribute-core" }
tribute-rc = { path = "crates/tribute-rc" }
tribute-front = { path = "crates/tribute-front" }
tribute-ir = { path = "crates/tribute-ir" }
tribute-passes = { path = "crates/tribute-passes" }
trunk-ir = { path = "crates/trunk-ir" }
trunk-ir-macros = { path = "crates/trunk-ir-macros" }
tribute-runtime = { path = "crates/tribute-runtime" }
trunk-ir-cranelift-backend = { path = "crates/trunk-ir-cranelift-backend" }
trunk-ir-wasm-backend = { path = "crates/trunk-ir-wasm-backend" }
unsynn = "0.3.0"
wasm-encoder = "0.259.0"
wasmparser = { version = "0.259.0", default-features = false, features = ["std", "validate", "features"] }
winnow = "1.0"
zmij = "1"

[package]
name = "tribute"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
ariadne.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
derive_more.workspace = true
fluent-uri.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
parking_lot.workspace = true
ropey.workspace = true
salsa.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tree-sitter.workspace = true
tree-sitter-tribute.workspace = true
tribute-core.workspace = true
tribute-front.workspace = true
tribute-ir.workspace = true
tribute-passes.workspace = true
trunk-ir = { workspace = true, features = ["salsa"] }
tempfile.workspace = true
trunk-ir-cranelift-backend.workspace = true
trunk-ir-wasm-backend.workspace = true

[dev-dependencies]
wasmparser.workspace = true
insta.workspace = true
itertools.workspace = true
salsa-test-macros = { path = "crates/salsa-test-macros" }
serde.workspace = true

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Profile for building tribute-runtime as a lean no_std staticlib.
# Usage: cargo build -p tribute-runtime --profile runtime
[profile.runtime]
inherits = "release"
panic = "abort"
