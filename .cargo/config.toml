[alias]
xtask = "run --package xtask --"

[build]
# Incremental artifacts bypass a rustc-wrapper cache (when one is
# configured) and grow each worktree's target directory.
incremental = false

[env]
# Development sysroot that `cargo xtask runtime` populates. The compiler reads
# it when linking native executables; an existing value takes precedence.
TRIBUTE_SYSROOT = { value = "target/sysroot", relative = true }
# Criterion output, including saved baselines, stays in the workspace target
# directory; the CodSpeed compatibility layer otherwise writes under the
# benchmarked package.
CRITERION_HOME = { value = "target/criterion", relative = true }
